<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rastreador de postulaciones</title>
    <meta name="description" content="Registro personal de postulaciones laborales: empresas, roles, estados y notas de seguimiento." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Aplica el tema guardado antes de pintar, para evitar el parpadeo.
      try {
        const saved = localStorage.getItem("application-theme");
        const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Rastreador de postulaciones</h1>
          <p class="subtitle">Dónde aplicaste, en qué quedó y qué falta hacer.</p>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar a tema oscuro">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" /></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </header>

      <section class="pipeline" aria-labelledby="pipelineTitle">
        <h2 id="pipelineTitle" class="visually-hidden">Resumen por estado</h2>
        <div id="pipelineBar" class="pipeline-bar" aria-hidden="true"></div>
        <div id="statusFilters" class="status-filters" role="group" aria-label="Filtrar por estado"></div>
      </section>

      <main class="layout">
        <section class="panel form-panel" aria-labelledby="formTitle">
          <h2 id="formTitle">Nueva postulación</h2>

          <form id="applicationForm" novalidate>
            <div class="field">
              <label for="company">Empresa</label>
              <input id="company" name="company" type="text" autocomplete="organization" placeholder="Ej: Globant" required />
              <p class="field-error" id="companyError" hidden>Escribí el nombre de la empresa.</p>
            </div>

            <div class="field">
              <label for="role">Rol</label>
              <input id="role" name="role" type="text" placeholder="Ej: Analista funcional trainee" required />
              <p class="field-error" id="roleError" hidden>Escribí el rol al que aplicaste.</p>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="date">Fecha</label>
                <input id="date" name="date" type="date" required />
                <p class="field-error" id="dateError" hidden>Elegí la fecha en que aplicaste.</p>
              </div>

              <div class="field">
                <label for="status">Estado</label>
                <select id="status" name="status">
                  <option value="Enviado">Enviado</option>
                  <option value="En proceso">En proceso</option>
                  <option value="Rechazado">Rechazado</option>
                  <option value="Oferta">Oferta</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="notes">Notas de seguimiento <span class="optional">(opcional)</span></label>
              <textarea id="notes" name="notes" rows="3" placeholder="Ej: Me contactó RR. HH., piden una entrevista técnica."></textarea>
            </div>

            <button class="btn btn-primary" type="submit">Agregar postulación</button>
          </form>
        </section>

        <section class="list-panel" aria-labelledby="listTitle">
          <div class="list-header">
            <h2 id="listTitle">Postulaciones</h2>
            <p id="countText" class="count-text"></p>
          </div>

          <div class="search">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <input id="searchInput" type="search" placeholder="Buscar por empresa o rol" aria-label="Buscar postulaciones" />
          </div>

          <div id="applicationsList" class="applications-list"></div>

          <div id="emptyState" class="empty-state" hidden>
            <p id="emptyTitle" class="empty-title"></p>
            <p id="emptyText" class="empty-text"></p>
            <button id="emptyAction" class="btn btn-quiet" type="button" hidden></button>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
